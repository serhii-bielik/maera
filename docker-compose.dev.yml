services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: maera
      POSTGRES_PASSWORD: maera
      POSTGRES_DB: maera
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
